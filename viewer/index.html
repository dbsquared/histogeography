<style>
  html, body { margin:0; height:100%; font-family:"Microsoft YaHei","PingFang SC",sans-serif; }
  #map { position:absolute; inset:0; background:#0d1b2a; }
  .panel {
    background:rgba(20,28,40,0.88); color:#e8eef5; border:1px solid #34507a;

      #6ba356 25%, #c9b458 35%, #c9a048 45%, #a67c3d 55%, #8b5e2f 65%,

  #legend .ticks { position:relative; height:16px; font-size:10px; color:#cfe0f0; }

  .clabel {
    background:rgba(30,20,10,0.72); color:#ffe7c2; border:1px solid #7a5230;
    border-radius:3px; padding:0 3px; font-size:11px; font-weight:bold;
    white-space:nowrap; pointer-events:none;
    transform:translate(var(--lx,0px),var(--ly,0px));
  }
  .plabel {
    color:#fff; font-weight:bold;
    font-size:calc(8px * var(--lscale,1));
    text-shadow:0 0 3px #000,0 0 3px #000,1px 1px 2px #000;
    white-space:nowrap; pointer-events:none;
    transform:translate(var(--lx,0px),var(--ly,0px));
    display:inline-flex; align-items:center; justify-content:center;
    width:100%; height:100%; box-sizing:border-box;
  }
  .sealabel {
    color:#ffd24d; font-weight:bold;
    font-size:calc(9px * var(--lscale,1));
    text-shadow:0 0 3px #000,0 0 3px #000,1px 1px 2px #000;
    white-space:nowrap; pointer-events:none;
    transform:translate(var(--lx,0px),var(--ly,0px));
    display:inline-flex; align-items:center; justify-content:center;
    width:100%; height:100%; box-sizing:border-box;
  }
  .rlabel {
    color:#bfe0ff; font-weight:bold;
    font-size:calc(8px * var(--lscale,1));
    text-shadow:0 0 3px #06203f,0 0 3px #06203f,1px 1px 2px #06203f;
    white-space:nowrap; pointer-events:none;
    transform:translate(var(--lx,0px),var(--ly,0px));
    display:inline-flex; align-items:center; justify-content:center;
    width:100%; height:100%; box-sizing:border-box;
  }
  .leaflet-control-scale { background:rgba(20,28,40,0.7); }
  #scs-inset { position:absolute; bottom:135px; right:12px; z-index:1000; width:240px; }
  #scs-inset .hd { font-weight:bold; margin-bottom:4px; }

.scslabel { fill:#ffe7c2; font-size:7px; font-weight:bold; paint-order:stroke;
            stroke:#5a2a00; stroke-width:1.7px; stroke-linejoin:round; }
/* ── 汉末十三州图层标签（HTML div 版，无背景、纯描边） ── */
.hanstate-label {
  color:#ff6b35; font-weight:bold;
  font-size:calc(13px * var(--lscale,1));
  text-shadow:0 0 3px #000,0 0 4px #000,1px 1px 3px #000,
    -1px -1px 2px #000,1px -1px 2px #000,-1px 1px 2px #000;
  white-space:nowrap; pointer-events:none;
  display:inline-block; line-height:18px;

}
.hanseat-label {
  color:#ffe7c2; font-weight:bold;
  font-size:calc(6px * var(--lscale,1));
  text-shadow:0 0 2px #000,0 0 2px #000,1px 1px 2px #000,
    -1px -1px 1px #000,1px -1px 1px #000,-1px 1px 1px #000;
  white-space:nowrap; pointer-events:none;
  display:inline-block; line-height:9px;
  transform:translate(calc(8px + var(--lx,0px)), calc(-50% + var(--ly,0px)));
}
.hanseat-label.capital {
  color:#ffd24d;
  font-size:calc(7px * var(--lscale,1));
}
.hanseat-label .zhi {
  font-size:calc(5px * var(--lscale,1));
  font-weight:normal; opacity:0.82;
}
/* ── 主要城市图层 ── */
.citypt { pointer-events:auto; cursor:help; }
.citypt svg { display:block; overflow:visible; }.tk-label{display:inline-block;white-space:nowrap;writing-mode:horizontal-tb;pointer-events:none;font-weight:bold;font-size:calc(9px * var(--tk-lscale,1));letter-spacing:0;line-height:1;transform:translate(calc(13px + var(--lx,0px)), calc(-50% + var(--ly,0px)));text-shadow:0 0 2px #000,0 0 3px #000,1px 1px 2px #000,-1px -1px 2px #000,1px -1px 2px #000,-1px 1px 2px #000;}.tk-label.city{color:#ffd479;}.tk-label.pass{color:#cfd8dc;}.tk-label.ford{color:#90caf9;}.tk-label.battle{color:#ffd24d;}
.citylabel {
  font-weight:bold; white-space:nowrap; pointer-events:none;
  font-size:calc(10px * var(--lscale,1));
  line-height:14px;
  display:inline-block;
  transform:translate(calc(8px + var(--lx,0px)), calc(-50% + var(--ly,0px)));
  transform-origin:left center;
}
.citylabel.capital         { color:#9fe5f5; text-shadow:0 0 3px #000,0 0 3px #000,1px 1px 2px #000,-1px -1px 2px #000,1px -1px 2px #000,-1px 1px 2px #000; }
.citylabel.ancient_capital { color:#ffd24d; text-shadow:0 0 3px #000,0 0 3px #000,1px 1px 2px #000,-1px -1px 2px #000,1px -1px 2px #000,-1px 1px 2px #000; }
.citylabel.battle          { color:#ffb3b3; text-shadow:0 0 3px #000,0 0 3px #000,1px 1px 2px #000,-1px -1px 2px #000,1px -1px 2px #000,-1px 1px 2px #000; }
#controls .subctl { margin-left:18px; font-size:12px; color:#bcd; }
#controls .citysep { margin-top:6px; border-top:1px dashed #34507a; padding-top:6px; }
  #controls .btn {
    display:inline-block; cursor:pointer; margin-top:8px; margin-right:6px;
    background:#1f3656; color:#cfe0f0; border:1px solid #4a6fa5;

  /* 截图模式：一键隐藏所有界面元素（地图内容保留） */
  .screenshot-mode .panel,

  #exit-shot {

  }

  .screenshot-mode #exit-shot { display:block; }
</style>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="data.js?v=2026070803"></script>
<script src="scs_inset_data.js?v=2026070801"></script>
<script src="cities.js?v=2026072001"></script>
<script src="han_states.js?v=2026080124"></script>
    <script src="three_kingdoms_sites.js?v=2026080201"></script>
<script>
const LAT_MIN=15, LAT_MAX=55, LON_MIN=72, LON_MAX=140;
const BOUNDS=[[LAT_MIN,LON_MIN],[LAT_MAX,LON_MAX]];

// 使用笛卡尔坐标系(CRS.Simple)，与 Plate Carrée 底图一致
// 避免 Web Mercator 对大范围 imageOverlay 造成 1200km+ 扭曲
// Simple CRS 下 1 地图单位=1 度，缩放层级用负值表示"看全图"
const map=L.map('map',{
  crs:L.CRS.Simple,
  center:[35,105],
  minZoom:-2, maxZoom:10, zoomSnap:0.25, zoomDelta:0.5,
  scrollWheelZoom:true,
  attributionControl:false
});
L.control.scale({imperial:false,position:'bottomleft'}).addTo(map);
map.fitBounds(BOUNDS);

// 省名标签随镜头缩放：以全图默认缩放为基准(1.0, 约8px)，放大时增大、缩小时减小
const baseZoom = map.getZoom();
function updateLabelScale(){
  let s = Math.pow(1.28, map.getZoom() - baseZoom);
  s = Math.max(0.7, Math.min(2.4, s));
  document.documentElement.style.setProperty('--lscale', s);
  // 三国地标标签字号随缩放：全图(大尺度)用小字、放大后相应变大；基准0.62使 overview 不糊
  let ts = 0.62 * Math.pow(1.3, map.getZoom() - baseZoom);
  ts = Math.max(0.5, Math.min(3.0, ts));
  document.documentElement.style.setProperty('--tk-lscale', ts);
}
map.on('zoomend', updateLabelScale);
updateLabelScale();

// ── 全局标签自动防重叠（重叠的标签自动挪到附近空白处，绝不隐藏）──
const _LBL_SEL  = '.clabel,.plabel,.rlabel,.hanstate-label,.hanseat-label,.citylabel,.tk-label';
const _LBL_PAD  = 2;                           // 像素间距，避免贴边
const _LBL_CANVAS = document.createElement('canvas');
const _LBL_CTX = _LBL_CANVAS.getContext('2d');
// 候选偏移：从“原位”开始，按半径递增向 8 个方向扇形展开（重叠标签挪到附近空白，绝不隐藏）
// 螺旋候选位：360°均匀采样，按距原点距离排序，重叠时可向任意方向找空地
// 螺旋候选位：360°均匀采样，按距原点距离排序，重叠时可向任意方向找空地
const _DIRS = (function(){
  const dirs = [[0,0]];
  const seen = new Set(['0,0']);
  const add = (x,y)=>{ const k=Math.round(x)+','+Math.round(y); if(!seen.has(k)){seen.add(k); dirs.push([Math.round(x),Math.round(y)]);} };
  for(let r=14; r<=90; r+=14){
    const n = Math.max(8, Math.round(2*Math.PI*r/18));
    for(let i=0;i<n;i++){ const a=(i/n)*Math.PI*2; add(r*Math.cos(a), r*Math.sin(a)); }
  }
  for(let r=100; r<=140; r+=20){
    const n = Math.max(12, Math.round(2*Math.PI*r/22));
    for(let i=0;i<n;i++){ const a=(i/n)*Math.PI*2; add(r*Math.cos(a), r*Math.sin(a)); }
  }
  return dirs;
})();
// 图标关联标签的候选位：先尝试自然位，然后从图标中心由近到远生成 360° 均匀候选。
// 打分选出「离自己图标最近」且「离其他标签/图标最远」的位置，避免互相挤兑。
function _iconCandidates(baseDx, baseDy, iconR, labelW, labelH){
  const baseAng = Math.atan2(baseDy, baseDx);
  const minR = Math.max(iconR + Math.max(labelW,labelH)/2 + 3, 14);
  const list = [];
  const seen = new Set();
  // 0) 自然位
  const nat = [Math.round(baseDx), Math.round(baseDy)];
  seen.add(nat[0]+','+nat[1]); list.push(nat);
  // 1) 由近到远，每圈均匀 16 方向
  for(let r=minR; r<=80; r += (r<40 ? 8 : 12)){
    const n = 16;
    for(let i=0;i<n;i++){
      const a = baseAng + (i/n)*Math.PI*2;
      const dx = Math.round(r*Math.cos(a));
      const dy = Math.round(r*Math.sin(a));
      const k = dx+','+dy;
      if(!seen.has(k)){ seen.add(k); list.push([dx,dy]); }
    }
  }
  return list;
}
function _lblPriority(el){
  const c = el.className || '';
  if(c.indexOf('hanstate-label')>=0) return 92;
  if(c.indexOf('citylabel')>=0 && c.indexOf('ancient_capital')>=0) return 82;
  if(c.indexOf('citylabel')>=0 && c.indexOf('capital')>=0) return 90;
  if(c.indexOf('plabel')>=0) return 84;
  if(c.indexOf('hanseat-label')>=0 && c.indexOf('capital')>=0) return 78;
  if(c.indexOf('tk-label')>=0 && c.indexOf('battle')>=0) return 72;
  if(c.indexOf('tk-label')>=0 && c.indexOf('city')>=0) return 70;
  if(c.indexOf('citylabel')>=0 && c.indexOf('battle')>=0) return 66;
  if(c.indexOf('hanseat-label')>=0) return 46;
  if(c.indexOf('tk-label')>=0 && c.indexOf('pass')>=0) return 44;
  if(c.indexOf('rlabel')>=0) return 40;
  if(c.indexOf('tk-label')>=0 && c.indexOf('ford')>=0) return 36;
  if(c.indexOf('clabel')>=0) return 20;
  return 30;
}
function _labelBox(el){
  const rb = el.getBoundingClientRect();
  if(rb.width<2 || rb.height<2) return null;
  if(el.querySelector('br')) return rb;                 // 多行：用元素盒
  const text = (el.textContent||'').trim();
  if(!text) return rb;
  const cs = getComputedStyle(el);
  const fs = parseFloat(cs.fontSize)||12;
  _LBL_CTX.font = (cs.fontWeight||'400')+' '+fs+'px '+(cs.fontFamily||'sans-serif');
  const tw = _LBL_CTX.measureText(text).width;
  const w = tw + 4;                 // 用文字实测宽（省名/河流/海拔等图标盒溢出的也准）
  const h = Math.ceil(fs*1.25) + 4; // 用字号实测高
  const cx = rb.left + rb.width/2, cy = rb.top + rb.height/2;
  return { left:cx-w/2, right:cx+w/2, top:cy-h/2, bottom:cy+h/2 };
}
function _lblOverlap(a,b,pad){
  return !(a.right+pad <= b.left-pad || a.left-pad >= b.right+pad ||
           a.bottom+pad <= b.top-pad || a.top-pad >= b.bottom+pad);
}
// 给候选位置打分：不碰撞前提下，离自己图标越近越好，离其他标签/图标越远越好
function _labelCandidateScore(cand, ownIcon, placed, nearObs, ownTid){
  for(let j=0;j<placed.length;j++){ if(_lblOverlap(cand, placed[j].box, _LBL_PAD)) return -Infinity; }
  for(let j=0;j<nearObs.length;j++){ if(nearObs[j].tid!==ownTid && _lblOverlap(cand, nearObs[j].box, _LBL_PAD)) return -Infinity; }
  const cx=(cand.left+cand.right)/2, cy=(cand.top+cand.bottom)/2;
  const dOwn = Math.hypot(cx-ownIcon.cx, cy-ownIcon.cy);
  let dOther = 300;
  for(let j=0;j<placed.length;j++){
    const b=placed[j].box;
    dOther = Math.min(dOther, Math.hypot(cx-(b.left+b.right)/2, cy-(b.top+b.bottom)/2));
  }
  for(let j=0;j<nearObs.length;j++){
    if(nearObs[j].tid===ownTid) continue;
    dOther = Math.min(dOther, Math.hypot(cx-nearObs[j].cx, cy-nearObs[j].cy));
  }
  return -dOwn*3 + dOther*0.7;
}
function applyLabelCollision(){
  if(!map || !map._loaded) return;
  const mapEl = map.getContainer();
  const all = Array.prototype.slice.call(mapEl.querySelectorAll(_LBL_SEL));
  for(let i=0;i<all.length;i++){ all[i].style.setProperty('--lx','0px'); all[i].style.setProperty('--ly','0px'); }
  // 图标障碍
  const obstacles = Array.prototype.slice.call(mapEl.querySelectorAll('.tkpt svg[data-tkid], .citypt svg[data-tkid]')).map(sv=>{
    const r = sv.getBoundingClientRect();
    return { tid: sv.getAttribute('data-tkid'), box:{left:r.left,right:r.right,top:r.top,bottom:r.bottom}, cx:(r.left+r.right)/2, cy:(r.top+r.bottom)/2 };
  });
  const items = [];
  for(let i=0;i<all.length;i++){
    const box = _labelBox(all[i]);
    if(!box) continue;
    items.push({ el:all[i], box:box, prio:_lblPriority(all[i]), tid:all[i].getAttribute('data-tkid') , idx:i });
  }
  items.sort((a,b)=> b.prio - a.prio || a.idx - b.idx);
  const placed = [];
  for(let i=0;i<items.length;i++){
    const a = items[i].box;
    const ownTid = items[i].tid;
    const ownIcon = ownTid ? obstacles.find(ob=>ob.tid===ownTid) : null;
    const nearObs = obstacles.filter(ob => !(ob.box.right < a.left-120 || ob.box.left > a.right+120 || ob.box.bottom < a.top-120 || ob.box.top > a.bottom+120));
    let chosen = null;

    // 有专属图标的标签：以图标中心为基准 360° 找最近空地
    if(ownIcon){
      const cx = (a.left+a.right)/2, cy = (a.top+a.bottom)/2;
      const baseDx = cx - ownIcon.cx, baseDy = cy - ownIcon.cy; // 自然位相对图标中心的偏移
      const lw = a.right-a.left, lh = a.bottom-a.top;
      const candidates = _iconCandidates(baseDx, baseDy, Math.max(ownIcon.box.right-ownIcon.box.left, ownIcon.box.bottom-ownIcon.box.top)/2, lw, lh);
      let bestScore = -Infinity;
      for(let k=0;k<candidates.length;k++){
        const [dx,dy] = candidates[k];
        const shiftX = dx - baseDx, shiftY = dy - baseDy;
        const cand = { left:a.left+shiftX, right:a.right+shiftX, top:a.top+shiftY, bottom:a.bottom+shiftY };
        const sc = _labelCandidateScore(cand, ownIcon, placed, nearObs, ownTid);
        if(sc > bestScore){ bestScore=sc; chosen=[shiftX,shiftY]; }
      }
    }

    // 无图标或图标周围没空位：退化为通用螺旋
    if(!chosen){
      for(let k=0;k<_DIRS.length;k++){
        const dx=_DIRS[k][0], dy=_DIRS[k][1];
        const cand = { left:a.left+dx, right:a.right+dx, top:a.top+dy, bottom:a.bottom+dy };
        let ok=true;
        for(let j=0;j<placed.length;j++){ if(_lblOverlap(cand, placed[j].box, _LBL_PAD)){ ok=false; break; } }
        if(ok){
          for(let j=0;j<nearObs.length;j++){
            const ob=nearObs[j];
            if(ob.tid===ownTid) continue;
            if(_lblOverlap(cand, ob.box, _LBL_PAD)){ ok=false; break; }
          }
        }
        if(ok){ chosen=[dx,dy]; break; }
      }
    }

    if(chosen){
      items[i].el.style.setProperty('--lx', chosen[0]+'px');
      items[i].el.style.setProperty('--ly', chosen[1]+'px');
      placed.push({ box:{left:a.left+chosen[0],right:a.right+chosen[0],top:a.top+chosen[1],bottom:a.bottom+chosen[1]}, prio:items[i].prio });
    } else {
      placed.push({ box:a, prio:items[i].prio });
    }
  }
}

function riverMidpoint(geom){
  let best=null, bestLen=-1;
  const segs = geom.type==='MultiLineString' ? geom.coordinates : [geom.coordinates];
  for(const s of segs){ if(s.length>bestLen){ bestLen=s.length; best=s; } }
  if(!best || !best.length) return null;
  const m=best[Math.floor(best.length/2)];
  return [m[1], m[0]];
}

function buildScsInset(){
  const D = window.SCS_INSET; if(!D) return;
  const b = D.box, W = 240, midLat = (b.lat0 + b.lat1) / 2;
  const H = Math.round(W * (b.lat1 - b.lat0) / (b.lon1 - b.lon0) * Math.cos(midLat * Math.PI / 180));
  const px = (lon, lat) => [ (lon - b.lon0) / (b.lon1 - b.lon0) * W,
                              (b.lat1 - lat) / (b.lat1 - b.lat0) * H ];
  const pathOf = segs => {
    let d = '';
    segs.forEach(s => { s.forEach((p, i) => {
      const [x, y] = px(p[0], p[1]);
      d += (i === 0 ? 'M' : 'L') + x.toFixed(1) + ' ' + y.toFixed(1);
    }); d += ' '; });
    return d;
  };
  let grid = '';
  for (let lon = Math.ceil(b.lon0 / 5) * 5; lon <= b.lon1; lon += 5) {
    const [x0, y0] = px(lon, b.lat0), [x1, y1] = px(lon, b.lat1);
    grid += `<line x1="${x0.toFixed(1)}" y1="${y0.toFixed(1)}" x2="${x1.toFixed(1)}" y2="${y1.toFixed(1)}"/>`;
  }
  for (let lat = Math.ceil(b.lat0 / 5) * 5; lat <= b.lat1; lat += 5) {
    const [x0, y0] = px(b.lon0, lat), [x1, y1] = px(b.lon1, lat);
    grid += `<line x1="${x0.toFixed(1)}" y1="${y0.toFixed(1)}" x2="${x1.toFixed(1)}" y2="${y1.toFixed(1)}"/>`;
  }
  const ne = pathOf(D.ne), coast = pathOf(D.coast), dash = pathOf(D.dash);
  let marks = '';
  D.islands.forEach(([lon, lat, name]) => {
    const [x, y] = px(lon, lat);
    marks += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2.2" fill="#fff" stroke="#c0392b" stroke-width="0.8"/>` +
             `<text x="${(x + 3).toFixed(1)}" y="${(y + 3.2).toFixed(1)}" class="scslabel">${name}</text>`;
  });
  const svg = `<svg viewBox="0 0 ${W} ${H}" width="100%" preserveAspectRatio="xMidYMid meet">
    <rect x="0" y="0" width="${W}" height="${H}" fill="#0e3a52"/>
    <g stroke="rgba(255,255,255,0.14)" stroke-width="0.5">${grid}</g>
    <path d="${ne}" fill="none" stroke="#5d7587" stroke-width="0.7" stroke-linejoin="round" opacity="0.85"/>
    <path d="${coast}" fill="none" stroke="#e0a06a" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="${dash}" fill="none" stroke="#c0392b" stroke-width="2.3" stroke-dasharray="6,4" stroke-linejoin="round"/>
    ${marks}
  </svg>`;
  document.getElementById('scs-svg').innerHTML = svg;
}

// 计算州名标签位置：优先面积加权质心（若落在州境内则用之，最贴合"几何中心"）；
// 若质心落在境外（如渤海海上），改用"最内点"算法（pole of inaccessibility 近似），
// 即在境内网格采样取离边界最远的点，保证标签始终落在州境内。
function pointInPolygon(x,y,poly){
  let inside=false;
  for(let i=0,j=poly.length-1;i<poly.length;j=i++){
    const xi=poly[i][0],yi=poly[i][1],xj=poly[j][0],yj=poly[j][1];
    if(((yi>y)!=(yj>y)) && (x < (xj-xi)*(y-yi)/(yj-yi)+xi)) inside=!inside;
  }
  return inside;
}
function distToSeg(px,py,x1,y1,x2,y2){
  const dx=x2-x1,dy=y2-y1,l2=dx*dx+dy*dy;
  if(l2===0) return Math.hypot(px-x1,py-y1);
  let t=((px-x1)*dx+(py-y1)*dy)/l2; t=Math.max(0,Math.min(1,t));
  return Math.hypot(px-(x1+t*dx), py-(y1+t*dy));
}
function computeLabelPoint(ring){
  const pts = ring.map(p=>[p[1],p[0]]);  // [[lat,lon]] → [[lon,lat]]
  const n = pts.length;
  let A=0,Cx=0,Cy=0;
  for(let i=0;i<n-1;i++){
    const x0=pts[i][0],y0=pts[i][1],x1=pts[i+1][0],y1=pts[i+1][1];
    const cr=x0*y1-x1*y0; A+=cr; Cx+=(x0+x1)*cr; Cy+=(y0+y1)*cr;
  }
  A*=0.5;
  const clon=Cx/(6*A), clat=Cy/(6*A);
  if(pointInPolygon(clon,clat,pts)) return [clat,clon];
  let lons=pts.map(p=>p[0]), lats=pts.map(p=>p[1]);
  const minLon=Math.min(...lons),maxLon=Math.max(...lons),minLat=Math.min(...lats),maxLat=Math.max(...lats);
  const step=0.12;
  let best=null,bestDist=-1;
  for(let lat=minLat;lat<=maxLat;lat+=step){
    for(let lon=minLon;lon<=maxLon;lon+=step){
      if(!pointInPolygon(lon,lat,pts)) continue;
      let dmin=Infinity;
      for(let i=0;i<n-1;i++){
        const d=distToSeg(lat,lon,pts[i][1],pts[i][0],pts[i+1][1],pts[i+1][0]);
        if(d<dmin)dmin=d;
      }
      if(dmin>bestDist){bestDist=dmin;best=[lat,lon];}
    }
  }
  return best || [clat,clon];
}

function cityShapeSVG(type, tid){

    }).bindTooltip(`<b>${f.name}</b> · ${cityTypeLabel[t]}<br/>${f.note||''}`,

    }));

  ['capital','ancient_capital','battle'].forEach(t=>{
    if(document.getElementById('cb-city-'+(t==='ancient_capital'?'ancap':t)).checked)

      '<path d="M -3 -3 L -3 -6 L 3 -6 L 3 -3 Z" fill="#ECEFF1" stroke="#37474F" stroke-width="0.7"/>' +

      '<g transform="rotate(-32)">' +

const tkLayer = { city:L.layerGroup(), pass:L.layerGroup(), ford:L.layerGroup(), battle:L.layerGroup() };
const tkLabelLayer = { city:L.layerGroup(), pass:L.layerGroup(), ford:L.layerGroup(), battle:L.layerGroup() };
(function(){
  const D = window.THREE_KINGDOM_SITES;
  if(!D){ console.warn('三国地标数据未加载'); return; }
  const size = { city:22, pass:20, ford:20, battle:22 };
  ['city','pass','ford','battle'].forEach(cat=>{
    (D[cat]||[]).forEach((f,idx)=>{
      const ll=[f.lat, f.lon];
      const tid='tk_'+cat+'_'+idx;
      const s=size[cat];
      const nudge=f.nudge||[0,0];
      const anchor=[s/2 - nudge[0], s/2 - nudge[1]];   // 像素微调，避免完全同坐标互遮
      const marker=L.marker(ll,{
        icon:L.divIcon({ className:'tkpt', html:tkIconSVG(cat,s,tid), iconSize:[s,s], iconAnchor:anchor }),
        keyboard:false
      });
      let tip;
      if(cat==='battle'){
        tip='<b>'+f.name+'</b>（'+f.year+'）<br/>地点：'+f.place+'<br/>'+f.sides+'<br/><span style="color:#ffd479">'+f.result+'</span>';
      } else {
        tip='<b>'+f.name+'</b> · '+tkMeta[cat].label+'<br/>今址：'+f.modern+'（'+f.zhou+'）<br/>'+(f.desc||'');
      }
      marker.bindPopup(tip,{className:'tk-popup', maxWidth:260});   // 仅点选时弹出详情
      tkLayer[cat].addLayer(marker);
      // 常驻名称标签（图标右侧，随图层开关；nudge 让标签跟随图标偏移对齐）
      tkLabelLayer[cat].addLayer(L.marker(ll,{
        icon:L.divIcon({ className:'', html:'<div class="tk-label '+cat+'" data-tkid="'+tid+'">'+f.name+'</div>',
          iconSize:[0,0], iconAnchor:[nudge[0], nudge[1]] }),
        interactive:false, keyboard:false

    });

  console.log('三国地标已加载：城池'+D.city.length+' 关隘'+D.pass.length+' 津渡'+D.ford.length+' 战役'+D.battle.length);
})();

// 3) 悬停查海拔 (数据已通过 data.js 注入 window.APP_DATA)
let elevData=null, elevMeta=null;
(()=>{
  try{
    elevMeta=window.APP_DATA.elevMeta;
    const b64=window.APP_DATA.elevGridB64;
    const bin=atob(b64);
    const bytes=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
    elevData=new Float32Array(bytes.buffer);
  }catch(e){ console.error('高程网格加载失败',e); }
})();

function sampleElev(lon,lat){
  if(!elevData||!elevMeta) return null;
  const {width:W,height:Hh,lon_min,lon_max,lat_max,lat_min}=elevMeta;
  let fx=(lon-lon_min)/(lon_max-lon_min)*(W-1);
  let fy=(lat_max-lat)/(lat_max-lat_min)*(Hh-1);
  if(fx<0||fy<0||fx>W-1||fy>Hh-1) return null;
  const x0=Math.floor(fx), y0=Math.floor(fy);
  const x1=Math.min(x0+1,W-1), y1=Math.min(y0+1,Hh-1);
  const tx=fx-x0, ty=fy-y0;
  const g=i=>elevData[i];
  const v00=g(y0*W+x0), v10=g(y0*W+x1), v01=g(y1*W+x0), v11=g(y1*W+x1);
  if([v00,v10,v01,v11].some(Number.isNaN)) return null;
  const v=(v00*(1-tx)+v10*tx)*(1-ty)+(v01*(1-tx)+v11*tx)*ty;
  return Math.round(v);
}
map.on('mousemove',e=>{
  const v=sampleElev(e.latlng.lng,e.latlng.lat);
  document.getElementById('elev-val').textContent = (v===null)?'—':v+' m';
});

  updateScs();
};
document.getElementById('cb-river').onchange=e=>{

    :(map.removeLayer(riverLayer), map.removeLayer(riverLabelLayer));

// 4b) 一键叠加全部 / 一键消除全部（复用逐层开关逻辑）
function setAll(on){
  ['cb-base','cb-contour','cb-label','cb-prov','cb-river',
   'cb-han-bnd','cb-han-seat',
   'cb-city-capital','cb-city-ancap','cb-city-battle',
   'cb-tk-city','cb-tk-pass','cb-tk-ford','cb-tk-battle'].forEach(id=>{
    const cb=document.getElementById(id);
    if(cb.checked!==on){ cb.checked=on; cb.onchange({target:cb}); }
  });
}
document.getElementById('btn-all-on').onclick=()=>setAll(true);
document.getElementById('btn-all-off').onclick=()=>setAll(false);

// 6) 截图模式：一键隐藏所有界面元素（地图内容保留）
function toggleShot(){ document.body.classList.toggle('screenshot-mode'); }
document.getElementById('btn-shot').onclick=toggleShot;
document.getElementById('exit-shot').onclick=toggleShot;
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){ document.body.classList.remove('screenshot-mode'); }
  else if(e.key==='s'||e.key==='S'){ e.preventDefault(); toggleShot(); }
});
