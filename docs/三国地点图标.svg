<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 112" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <defs>
    <linearGradient id="bladeGrad" x1="0" y1="-22" x2="6" y2="-3" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.5" stop-color="#CFD8DC"/>
      <stop offset="1" stop-color="#78909C"/>
    </linearGradient>
    <!-- 城池：带拱门的城堡 -->
    <g id="g-city" fill="#FFFFFF" fill-rule="evenodd">
      <path d="M -22 16 L -22 -10 L -18 -10 L -18 -18 L -10 -18 L -10 -10 L -6 -10 L -6 -18 L 2 -18 L 2 -10 L 6 -10 L 6 -18 L 14 -18 L 14 -10 L 18 -10 L 18 16 Z M -7 16 L -7 2 A 7 7 0 0 1 7 2 L 7 16 Z"/>
    </g>
    <!-- 关隘：长城（远山 + 垛口城墙 + 中央敌楼 + 坡屋顶门洞） -->
    <g id="g-pass">
      <path d="M -32 20 Q -16 5 0 16 Q 16 6 32 18 L 32 26 L -32 26 Z" fill="#FFFFFF" opacity="0.20"/>
      <path d="M -32 15 L -32 9 L -28 9 L -28 6 L -24 6 L -24 9 L -20 9 L -20 6 L -16 6 L -16 9 L -12 9 L -12 6 L -8 6 L -8 9 L -4 9 L -4 6 L 0 6 L 0 9 L 4 9 L 4 6 L 8 6 L 8 9 L 12 9 L 12 6 L 16 6 L 16 9 L 20 9 L 20 6 L 24 6 L 24 9 L 28 9 L 28 6 L 32 6 L 32 9 L 32 15 Z" fill="#ECEFF1" stroke="#37474F" stroke-width="0.7" stroke-linejoin="round"/>
      <path d="M -6 15 L -6 1 L -3 1 L -3 -3 L 3 -3 L 3 1 L 6 1 L 6 15 Z" fill="#ECEFF1" stroke="#37474F" stroke-width="0.7" stroke-linejoin="round"/>
      <path d="M -9 1 L 0 -7 L 9 1 Z" fill="#37474F"/>
      <path d="M -3 -3 L -3 -6 L 3 -6 L 3 -3 Z" fill="#ECEFF1" stroke="#37474F" stroke-width="0.7"/>
      <path d="M -2 15 L -2 8 A 2 2 0 0 1 2 8 L 2 15 Z" fill="#546E7A"/>
    </g>
    <!-- 津渡：帆船 + 水波 -->
    <g id="g-ford">
      <path d="M -15 -2 L 15 -2 L 10 6 L -10 6 Z" fill="#FFFFFF"/>
      <path d="M 0 -2 L 0 -18 L 11 -2 Z" fill="#FFFFFF"/>
      <path d="M 0 -18 L 0 -2" stroke="#FFFFFF" stroke-width="2" fill="none"/>
      <path d="M -22 12 q 5.5 -6 11 0 q 5.5 6 11 0 q 5.5 -6 11 0 q 5.5 6 11 0" stroke="#FFFFFF" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M -22 19 q 5.5 -6 11 0 q 5.5 6 11 0 q 5.5 -6 11 0 q 5.5 6 11 0" stroke="#FFFFFF" stroke-width="3" fill="none" stroke-linecap="round"/>
    </g>
    <!-- 战役：两把单刃弯刀交叉（银刃渐变 + 金护手 + 红刀穗 + 中心金点） -->
    <g id="g-battle">
      <g transform="rotate(32)">
        <path d="M -2.5 -3 L -2.5 -19 Q -2.5 -23 1.8 -22.3 L 4.2 -18 Q 5.2 -11 2.8 -3 Z" fill="url(#bladeGrad)" stroke="#455A64" stroke-width="0.5"/>
        <rect x="-5" y="-3.2" width="11" height="2.6" rx="1.1" fill="#C9A227"/>
        <rect x="-2" y="-0.6" width="4" height="13" rx="1.6" fill="#4E342E"/>
        <circle cx="0" cy="13" r="2.2" fill="#C9A227"/>
        <path d="M 0 14 C -3.2 17 -2.2 21.5 0 23 C 2.2 21.5 3.2 17 0 14 Z" fill="#C62828"/>
      </g>
      <g transform="rotate(-32)">
        <path d="M -2.5 -3 L -2.5 -19 Q -2.5 -23 1.8 -22.3 L 4.2 -18 Q 5.2 -11 2.8 -3 Z" fill="url(#bladeGrad)" stroke="#455A64" stroke-width="0.5"/>
        <rect x="-5" y="-3.2" width="11" height="2.6" rx="1.1" fill="#C9A227"/>
        <rect x="-2" y="-0.6" width="4" height="13" rx="1.6" fill="#4E342E"/>
        <circle cx="0" cy="13" r="2.2" fill="#C9A227"/>
        <path d="M 0 14 C -3.2 17 -2.2 21.5 0 23 C 2.2 21.5 3.2 17 0 14 Z" fill="#C62828"/>
      </g>
      <circle cx="0" cy="-1" r="2.6" fill="#FFC107" stroke="#37474F" stroke-width="0.5"/>
    </g>
  </defs>

  <circle cx="44"  cy="42" r="26" fill="#FFB300" stroke="#FFFFFF" stroke-width="2.5"/><use href="#g-city"  transform="translate(44,42) scale(0.6)"/>
  <circle cx="116" cy="42" r="26" fill="#546E7A" stroke="#FFFFFF" stroke-width="2.5"/><use href="#g-pass"  transform="translate(116,42) scale(0.6)"/>
  <circle cx="188" cy="42" r="26" fill="#1E88E5" stroke="#FFFFFF" stroke-width="2.5"/><use href="#g-ford"  transform="translate(188,42) scale(0.6)"/>
  <circle cx="260" cy="42" r="26" fill="#1B1B1B" stroke="#FFC107" stroke-width="3"/>  <use href="#g-battle" transform="translate(260,42) scale(0.6)"/>

  <text x="44"  y="96" text-anchor="middle" fill="#ECEFF1" font-size="13" font-weight="600">城池</text>
  <text x="116" y="96" text-anchor="middle" fill="#ECEFF1" font-size="13" font-weight="600">关隘</text>
  <text x="188" y="96" text-anchor="middle" fill="#ECEFF1" font-size="13" font-weight="600">津渡</text>
  <text x="260" y="96" text-anchor="middle" fill="#ECEFF1" font-size="13" font-weight="600">战役</text>
</svg>
