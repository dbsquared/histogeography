<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>汉末十三州 · 地形底图边界校正器</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
<style>
  html,body{margin:0;height:100%;font-family:"Microsoft YaHei",sans-serif;background:#0d1117;color:#e6e6e6}
  #map{position:absolute;inset:0;background:#10202e}
  #panel{position:absolute;top:10px;left:10px;width:262px;max-height:calc(100% - 20px);
         overflow:auto;background:rgba(20,28,38,.94);border:1px solid #2b3a4d;border-radius:8px;
         padding:10px 12px;font-size:13px;z-index:1000;box-shadow:0 4px 16px rgba(0,0,0,.5)}
  #panel h3{margin:4px 0 8px;font-size:14px;color:#7fd1ff}
  .hint{font-size:11px;color:#9fb0c0;line-height:1.5;margin-bottom:8px}
  .state-btn{display:block;width:100%;text-align:left;margin:3px 0;padding:5px 8px;border:1px solid #2b3a4d;
             border-radius:5px;background:#16202c;color:#e6e6e6;cursor:pointer;font-size:13px}
  .state-btn:hover{background:#1f2d3d}
  .state-btn.active{background:#23425e;border-color:#4aa3df;color:#fff}
  .sw{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:7px;vertical-align:-1px}
  .row{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
  button.act{flex:1;min-width:74px;padding:6px 4px;border:1px solid #2b3a4d;border-radius:5px;
             background:#16202c;color:#e6e6e6;cursor:pointer;font-size:12px}
  button.act:hover{background:#1f2d3d}
  button.primary{background:#1f4d6b;border-color:#4aa3df;color:#fff}
  button.act.on{background:#1f4d6b;border-color:#4aa3df;color:#fff}
  .chk{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:12px;color:#cfe0ee}
  #status{margin-top:8px;font-size:11px;color:#9fb0c0;min-height:16px;white-space:pre-line}
  .vertex-dot{background:#fff;border:2px solid #111;border-radius:50%;width:12px;height:12px;box-sizing:border-box;cursor:grab}
  .seat-dot{background:#ffd54a;border:2px solid #111;border-radius:50%;width:12px;height:12px;box-sizing:border-box;cursor:grab}
  .vertex-dot.sel,.seat-dot.sel{background:#ff7a18;border-color:#fff;box-shadow:0 0 0 2px #ff7a18}
  #issueList{margin-top:6px;max-height:180px;overflow:auto;display:none}
  .iss{display:block;width:100%;text-align:left;margin:2px 0;padding:3px 6px;border:1px solid #2b3a4d;
       border-radius:4px;background:#16202c;color:#cfe0ee;cursor:pointer;font-size:11px;line-height:1.4}
  .iss:hover{background:#1f2d3d}
  .iss .tag{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;vertical-align:0}
</style>
</head>
<body>
<div id="map"></div>
<div id="panel">
  <h3>十三州边界校正器</h3>
  <div class="hint">底图为 SRTM 晕渲。点左侧州名进入编辑，拖白色顶点微调边界、拖黄色点移动郡治；
  <b>Shift+点</b>多选顶点/郡治，<b>Shift+拖拽空白处框选</b>多个州界顶点（不含郡治/GCP），拖任一选中点可<b>整体平移</b>（多选平移时每个被拖顶点仍各自吸附附近边界）；<b>Delete 键 / 删除选中点</b>删除选中顶点（州至少保留 3 个）；<b>双击边界线段</b>在该边插入新顶点细化边界。拖边界顶点靠近他州边界会<b>优先吸附其顶点（角点）</b>、其次吸到边并沿边滑动，相连边自然贴合（相邻顶点保持原位）。改完点「导出」给我订正数据。</div>
  <div id="stateList"></div>
  <div class="row">
    <button class="act primary" id="btnExport">导出当前州</button>
    <button class="act" id="btnExportAll">导出全部</button>
  </div>
  <div class="row">
    <button class="act" id="btnReset">重置当前州</button>
    <button class="act" id="btnFit">定位当前州</button>
  </div>
  <div class="row">
    <button class="act" id="btnSelAll">全选顶点</button>
    <button class="act" id="btnClearSel">清除选择</button>
  </div>
  <div class="row">
    <button class="act" id="btnDel">删除选中点（Delete键）</button>
  </div>
  <div class="row">
    <button class="act" id="btnAddVertex">添加顶点模式</button>
  </div>
  <label class="chk"><input type="checkbox" id="chkSnap" checked> 磁吸吸附（拖点靠近边界自动吸附）</label>
  <label class="chk"><input type="checkbox" id="chkIssues"> 显示问题区（<span style="color:#ff5a5a">■</span>重叠 <span style="color:#ffd54a">■</span>缝隙）</label>
  <div id="issueList"></div>
  <div id="status"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="han_states.js"></script>
<script src="seam_issues.js"></script>
<script>
const LAT_MIN=15, LAT_MAX=55, LON_MIN=72, LON_MAX=140;
const BOUNDS=[[LAT_MIN,LON_MIN],[LAT_MAX,LON_MAX]];
// 放大再扩大一点：提高 maxZoom 上限，允许更精细缩放
const map=L.map('map',{crs:L.CRS.Simple,center:[32,108],minZoom:-2,maxZoom:18,zoomSnap:0.1,zoomDelta:0.5,scrollWheelZoom:true,attributionControl:false,boxZoom:false,doubleClickZoom:false});
L.control.scale({imperial:false,position:'bottomleft'}).addTo(map);
map.fitBounds(BOUNDS);
L.imageOverlay('base_terrain.png', BOUNDS, {opacity:0.92}).addTo(map);

const D=window.HAN_STATES;
if(!D||!D.states){ document.getElementById('status').textContent='han_states.js 未加载'; }
const states=D.states.map(st=>({
  name:st.name, color:st.color||'#EC407A',
  bnd:st.boundary.map(p=>[p[1],p[0]]),          // 内部 [lat,lon]
  seats:(st.seats||[]).map(s=>({name:s.name, ll:[s.lat,s.lon]})),
  meta:st.meta||{},
  edited:false
}));
const byName={}; states.forEach(s=>byName[s.name]=s);

const polyLayers={};
let current=null;
let handles=[];           // 当前州可拖拽顶点/郡治 markers
const selected=new Set(); // 多选集合
let dragSel=[], dragStartMouse=null, dragStartPos=[];
let snapLine=null;
const SNAP_PX=16;         // 磁吸触发像素距离（吸到线段）
const SNAP_VERTEX_PX=24;  // 顶点吸附优先阈值（更大，使靠近角点时优先对齐顶点）
let snapState=null;       // 当前吸附到的参考州名
let addMode=false;       // 添加顶点模式（单击边界插入顶点）

function setStatus(t){ document.getElementById('status').textContent=t; }
function clearSel(){ selected.forEach(m=>setSel(m,false)); selected.clear(); updateSelStatus(); }
function setSel(m,on){ m._sel=!!on; if(m._icon) m._icon.classList.toggle('sel',!!on); if(on) selected.add(m); else selected.delete(m); }
function updateSelStatus(){ if(current && selected.size>0) setStatus('已选 '+selected.size+' 个点（拖任一选中点整体平移）'); }

// 预计算所有州边界线段，供磁吸投影
const allSegments=[]; const stateRingLen={};
states.forEach(st=>{ const r=st.bnd, n=r.length; stateRingLen[st.name]=n;
  for(let i=0;i<n;i++) allSegments.push({state:st.name, vi:i, a:r[i], b:r[(i+1)%n]});
});

// 点到线段投影（latlon 空间），返回 [lat,lon]
function projectOnSeg(P,A,B){
  const ax=A[1],ay=A[0],bx=B[1],by=B[0],px=P[1],py=P[0];
  const dx=bx-ax, dy=by-ay, len2=dx*dx+dy*dy;
  let t = len2>0 ? ((px-ax)*dx+(py-ay)*dy)/len2 : 0;
  t=Math.max(0,Math.min(1,t));
  return [ay+t*dy, ax+t*dx];
}
// 投影到整条州界的环上（取最近点）
function projectOnRing(P, ring){
  let best=null,bestD=Infinity; const n=ring.length;
  for(let i=0;i<n;i++){
    const proj=projectOnSeg(P, ring[i], ring[(i+1)%n]);
    const d=(proj[0]-P[0])**2+(proj[1]-P[1])**2;
    if(d<bestD){ bestD=d; best=proj; }
  }
  return best;
}
function snapPoint(P, exState){
  const mp=map.latLngToContainerPoint(L.latLng(P[0],P[1]));
  // 优先：吸附到他州边界顶点（角点），对齐角点对角点
  let bestV=null, bestVD=SNAP_VERTEX_PX;
  for(const st of states){
    if(st.name===exState) continue;
    const ring=st.bnd, n=ring.length;
    for(let i=0;i<n;i++){
      const dp=map.latLngToContainerPoint(L.latLng(ring[i][0],ring[i][1]));
      const d=Math.hypot(mp.x-dp.x, mp.y-dp.y);
      if(d<bestVD){ bestVD=d; bestV={ll:ring[i].slice(), state:st.name, vi:i}; }
    }
  }
  if(bestV) return {ll:bestV.ll, seg:null, state:bestV.state, isVertex:true};
  // 次选：吸附到他州边界线段
  let best=null,bestD=SNAP_PX,bestSeg=null;
  for(const s of allSegments){
    if(s.state===exState) continue;   // 只吸附到其他州的边界，不自吸
    const proj=projectOnSeg(P,s.a,s.b);
    const dp=map.latLngToContainerPoint(L.latLng(proj[0],proj[1]));
    const d=Math.hypot(mp.x-dp.x, mp.y-dp.y);
    if(d<bestD){ bestD=d; best=proj; bestSeg=s; }
  }
  return best?{ll:best,seg:bestSeg,state:bestSeg.state}:null;
}
// 投影到指定州的整条边界环上（用于已锁定参考州后沿边滑动）；若投影点附近有该州顶点则吸附到顶点
function snapToStateRing(P, stateName){
  const ring=byName[stateName].bnd;
  const proj=projectOnRing(P, ring);
  const mp=map.latLngToContainerPoint(L.latLng(proj[0],proj[1]));
  let bestV=null, bestVD=SNAP_VERTEX_PX;
  for(let i=0;i<ring.length;i++){
    const dp=map.latLngToContainerPoint(L.latLng(ring[i][0],ring[i][1]));
    const d=Math.hypot(mp.x-dp.x, mp.y-dp.y);
    if(d<bestVD){ bestVD=d; bestV=ring[i]; }
  }
  return bestV ? bestV.slice() : proj;
}
function showSnap(seg){
  if(snapLine){ map.removeLayer(snapLine); snapLine=null; }
  if(seg){ snapLine=L.polyline([seg.a,seg.b],{color:'#39ff14',weight:2,opacity:0.95,dashArray:'4,3'}).addTo(map);
    setStatus('已磁吸到「'+seg.state+'」边界，沿边滑动中…'); }
}

function clearHandles(){ handles.forEach(h=>map.removeLayer(h)); handles=[]; clearSel(); }

function makeHandle(ll, kind, idx){
  const cls = kind==='seat'?'seat-dot':'vertex-dot';
  const m=L.marker(ll,{draggable:true,icon:L.divIcon({className:cls,iconSize:[12,12],iconAnchor:[6,6]})});
  m._kind=kind; m._vi = kind==='vertex'? idx : null; m._si = kind==='seat'? idx : null; m._sel=false;
  m.on('click', e=>{ L.DomEvent.stopPropagation(e);
    if(e.originalEvent.shiftKey) setSel(m,!m._sel);
    else { clearSel(); setSel(m,true); }
    updateSelStatus();
  });
  m.on('dragstart', ()=>{
    if(!m._sel){ clearSel(); setSel(m,true); }
    dragSel=[...selected];
    dragStartMouse=m.getLatLng();
    dragStartPos=dragSel.map(h=> (h._kind==='vertex'? current.bnd[h._vi].slice() : current.seats[h._si].ll.slice()));
    dragSel.forEach(h=> h._snapState=null);
    snapState=null;
    current.edited=true;
  });
  m.on('drag', e=>{
    const mouse=map.mouseEventToLatLng(e.originalEvent);
    if(dragSel.length<=1){
      if(m._kind==='vertex' && document.getElementById('chkSnap').checked){
        let snap=null;
        if(snapState){
          // 已锁定参考州：把鼠标位置投影到该州整条边界环上，实现沿边滑动
          const locked=snapToStateRing([mouse.lat,mouse.lng], snapState);
          snap={ll:locked, state:snapState, seg:null};
        } else {
          snap=snapPoint([mouse.lat,mouse.lng], current.name);
          if(snap) snapState=snap.state;
        }
        if(snap){
          current.bnd[m._vi]=snap.ll.slice();
          m.setLatLng(snap.ll);
          polyLayers[current.name].setLatLngs(current.bnd);
          showSnap(snap.seg || {state:snap.state, a:snap.ll, b:snap.ll});
          if(snap.isVertex) setStatus('已磁吸到「'+snap.state+'」的顶点（角点），拖动沿其边界滑动');
          return;
        }
      }
      snapState=null;
      const tgt=[mouse.lat,mouse.lng];
      m.setLatLng(tgt);
      if(m._kind==='vertex') current.bnd[m._vi]=tgt; else current.seats[m._si].ll=tgt;
      polyLayers[current.name].setLatLngs(current.bnd);
      showSnap(null);
    } else {
      const dLat=mouse.lat-dragStartMouse.lat, dLng=mouse.lng-dragStartMouse.lng;
      dragSel.forEach((h,k)=>{
        const free=[dragStartPos[k][0]+dLat, dragStartPos[k][1]+dLng];
        let np=free;
        // 多选平移时，每个被拖拽的顶点仍各自检测磁吸（靠近参考州边界则吸上并沿边滑动）
        if(h._kind==='vertex' && document.getElementById('chkSnap').checked){
          let snap=null;
          if(h._snapState){ snap={ll:snapToStateRing(free, h._snapState), state:h._snapState, seg:null}; }
          else { snap=snapPoint(free, current.name); if(snap) h._snapState=snap.state; }
          if(snap) np=snap.ll;
        }
        if(h._kind==='vertex') current.bnd[h._vi]=np; else current.seats[h._si].ll=np;
        h.setLatLng(np);
      });
      polyLayers[current.name].setLatLngs(current.bnd);
      showSnap(null);
    }
  });
  m.on('dragend', ()=>{ showSnap(null); snapState=null; dragSel.forEach(h=>h._snapState=null); afterEdit(); });
  m.addTo(map); handles.push(m);
  return m;
}

function renderBase(){
  states.forEach(st=>{
    const poly=L.polygon(st.bnd,{color:st.color,weight:2,opacity:0.95,fillColor:st.color,fillOpacity:0.18});
    poly.bindTooltip(st.name,{sticky:true});
    poly.on('click',()=>selectState(st.name));
    polyLayers[st.name]=poly; poly.addTo(map);
    st.seats.forEach(s=>{
      const m=L.marker(s.ll,{icon:L.divIcon({className:'seat-dot',iconSize:[11,11],iconAnchor:[5.5,5.5]})});
      m.bindTooltip(s.name,{direction:'top'});
      m.on('click',()=>selectState(st.name));
      m.addTo(map);
    });
  });
}

function selectState(name){
  clearHandles();
  current=byName[name];
  current.bnd.forEach((ll,i)=> makeHandle(ll,'vertex',i));
  current.seats.forEach((s,i)=> makeHandle(s.ll,'seat',i));
  document.querySelectorAll('.state-btn').forEach(b=>b.classList.toggle('active',b.dataset.name===name));
  setStatus('编辑中：'+name+'（'+current.bnd.length+' 顶点 / '+current.seats.length+' 郡治）');
}

function fitCurrent(){ if(current) map.fitBounds(L.latLngBounds(current.bnd.concat(current.seats.map(s=>s.ll))).pad(0.15)); }

function resetState(){
  if(!current) return;
  const src=D.states.find(s=>s.name===current.name);
  current.bnd=src.boundary.map(p=>[p[1],p[0]]);
  current.seats=src.seats.map(s=>({name:s.name,ll:[s.lat,s.lon]}));
  current.edited=false;
  polyLayers[current.name].setLatLngs(current.bnd);
  selectState(current.name);
  setStatus('已重置：'+current.name); afterEdit();
}

function stateToFC(st){
  const ring=st.bnd.map(ll=>[ll[1],ll[0]]); ring.push(ring[0]);
  const feats=[ {type:'Feature',properties:{kind:'state_boundary'},geometry:{type:'Polygon',coordinates:[ring]}} ];
  st.seats.forEach(s=>feats.push({type:'Feature',properties:{kind:'commandery_seat',name:s.name},geometry:{type:'Point',coordinates:[s.ll[1],s.ll[0]]}}));
  return {type:'FeatureCollection',metadata:{state:st.name,color:st.color,verified:true,
    gcps:st.meta.gcps||0,max_err_km:st.meta.max_err_km||0,avg_err_km:st.meta.avg_err_km||0},features:feats};
}
function download(obj,fn){
  const blob=new Blob([JSON.stringify(obj,null,1)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=fn; a.click();
  URL.revokeObjectURL(a.href);
}
function exportState(){ if(!current)return; download(stateToFC(current),current.name+'.geojson'); setStatus('已导出：'+current.name+'.geojson'); }
function exportAll(){
  const all={type:'FeatureCollection',metadata:{title:'汉末十三州校正导出',count:states.length},features:[]};
  states.forEach(st=>{ const fc=stateToFC(st); fc.features.forEach(f=>{ if(f.properties.kind==='state_boundary') f.properties.state=st.name; all.features.push(f); }); });
  download(all,'all_states_edit.json');
  setStatus('已导出全部 '+states.length+' 州 -> all_states_edit.json');
}

const list=document.getElementById('stateList');
states.forEach(st=>{
  const b=document.createElement('button'); b.className='state-btn'; b.dataset.name=st.name;
  b.innerHTML='<span class="sw" style="background:'+st.color+'"></span>'+st.name;
  b.onclick=()=>selectState(st.name);
  list.appendChild(b);
});
document.getElementById('btnExport').onclick=exportState;
document.getElementById('btnExportAll').onclick=exportAll;
document.getElementById('btnReset').onclick=resetState;
document.getElementById('btnFit').onclick=fitCurrent;
document.getElementById('btnSelAll').onclick=()=>{ clearSel(); handles.forEach(h=>setSel(h,true)); updateSelStatus(); };
document.getElementById('btnClearSel').onclick=()=>{ clearSel(); setStatus('已清除选择'+(current?('（'+current.name+'）'):'')); };
// 删除选中顶点/郡治（Delete 键亦可）
function deleteSelected(){
  if(!current || selected.size===0){ setStatus('请先选中要删除的点（Shift+点 多选）'); return; }
  const vs=[...selected].filter(m=>m._kind==='vertex').map(m=>m._vi).sort((a,b)=>b-a);
  const ss=[...selected].filter(m=>m._kind==='seat').map(m=>m._si).sort((a,b)=>b-a);
  if(current.bnd.length - vs.length < 3){ setStatus('不能删：州至少需要 3 个顶点（删后剩 '+(current.bnd.length-vs.length)+' 个）'); return; }
  vs.forEach(i=> current.bnd.splice(i,1));
  ss.forEach(i=> current.seats.splice(i,1));
  current.edited=true;
  setStatus('已删除 '+vs.length+' 个顶点'+(ss.length?('、'+ss.length+' 个郡治'):'')+'，已重建顶点索引');
  selectState(current.name); afterEdit();  // 重建 handles（索引变化）
}
document.getElementById('btnDel').onclick=deleteSelected;
document.addEventListener('keydown', e=>{
  if((e.key==='Delete'||e.key==='Backspace') && selected.size && !(e.target && /INPUT|TEXTAREA/.test(e.target.tagName))){
    e.preventDefault(); deleteSelected();
  }
  if(e.key==='Escape' && addMode){ document.getElementById('btnAddVertex').click(); }
});
// 在边界线段上插入新顶点（thr: 单击点与最近边界的像素容差）
function tryInsertVertex(latlng, thr){
  if(!current) return false;
  const P=[latlng.lat, latlng.lng];
  const r=current.bnd, n=r.length; if(n<3) return false;
  let bi=-1, bproj=null, bd=Infinity;
  for(let i=0;i<n;i++){ const proj=projectOnSeg(P, r[i], r[(i+1)%n]); const d=(proj[0]-P[0])**2+(proj[1]-P[1])**2; if(d<bd){ bd=d; bi=i; bproj=proj; } }
  if(bi<0) return false;
  const mp=map.latLngToContainerPoint(latlng), dp=map.latLngToContainerPoint(L.latLng(bproj[0],bproj[1]));
  if(Math.hypot(mp.x-dp.x, mp.y-dp.y) > thr){ setStatus('离边界太远（>'+thr+'px），未插入顶点'); return false; }
  current.bnd.splice(bi+1, 0, bproj.slice());
  current.edited=true;
  setStatus('已在第 '+bi+' 条边插入顶点（共 '+current.bnd.length+' 个）；可继续拖/框选/删除');
  selectState(current.name); afterEdit();
  return true;
}
document.getElementById('btnAddVertex').onclick=function(){
  addMode=!addMode; this.classList.toggle('on',addMode);
  document.getElementById('map').style.cursor=addMode?'crosshair':'';
  setStatus(addMode?'添加顶点模式：点击边界线段即插入顶点（Esc 退出）':'已退出添加顶点模式');
};
// 点空白处清除选择（添加顶点模式下则插入顶点）
map.on('click', e=>{
  if(addMode){ tryInsertVertex(e.latlng, 40); return; }
  if(selected.size){ clearSel(); if(current) setStatus('编辑中：'+current.name); }
});

// ---------- Shift 拖拽框选顶点 ----------
let boxSel=false, boxStartPt=null, boxRect=null;
map.on('mousedown', e=>{
  if(!e.originalEvent.shiftKey || !current) return;
  const t=e.originalEvent.target;
  if(t && t.closest && t.closest('.vertex-dot,.seat-dot')) return; // 点在图标上交给 marker 拖拽；框选只针对当前州边界顶点，无需判州属
  boxSel=true; boxStartPt=e.containerPoint;
  map.dragging.disable();
  const ll0=map.containerPointToLatLng(boxStartPt);
  boxRect=L.rectangle([ll0,ll0],{color:'#4aa3df',weight:1,opacity:0.9,fillOpacity:0.08,dashArray:'4,3'}).addTo(map);
  e.originalEvent.preventDefault();
});
map.on('mousemove', e=>{
  if(!boxSel||!boxRect) return;
  boxRect.setBounds(L.latLngBounds(map.containerPointToLatLng(boxStartPt), map.containerPointToLatLng(e.containerPoint)));
});
map.on('mouseup', ()=>{
  if(!boxSel) return;
  boxSel=false; map.dragging.enable();
  if(boxRect){
    const b=boxRect.getBounds(); let cnt=0;
    // 框选仅作用于当前州（已单选）的州界顶点：handles 只含当前州，无需判断是否落到别州；只选顶点，不动郡治/GCP
    handles.forEach(h=>{ if(h._kind==='vertex' && b.contains(h.getLatLng())){ setSel(h,true); cnt++; } });
    map.removeLayer(boxRect); boxRect=null;
    updateSelStatus();
    if(cnt===0) setStatus('框选：框内无州界顶点（仅州界顶点入选，郡治不入选）');
    else setStatus('框选：选中 '+cnt+' 个「'+current.name+'」州界顶点');
  }
});

// ---------- 双击边界线段插入顶点（也可开启"添加顶点模式"后单击）----------
map.on('dblclick', e=>{
  if(!current) return;
  const t=e.originalEvent.target;
  if(t && t.closest && t.closest('.vertex-dot,.seat-dot')) return; // 点在图标上不插入
  tryInsertVertex(e.latlng, 40);
});

// ---------- 问题区：实时演算（纯前端栅格化，勾选即算）----------
const issueGroup=L.layerGroup();
const issueLayers=[];
const STEP=0.15;                          // 栅格分辨率（度）
const GX0=LON_MIN, GY0=LAT_MIN;
const GCOLS=Math.ceil((LON_MAX-LON_MIN)/STEP)+1;
const GROWS=Math.ceil((LAT_MAX-LAT_MIN)/STEP)+1;
const DEGKM=111.32;
const MIN_AREA_KM2=200;   // 小于此面积的问题区视为噪声，不显示
function convexHull(p){
  if(p.length<3) return p;
  const pts=p.slice().sort((a,b)=>a[1]-b[1]||a[0]-b[0]);
  const cr=(o,a,b)=>(a[1]-o[1])*(b[0]-o[0])-(a[0]-o[0])*(b[1]-o[1]);
  const lo=[]; for(const q of pts){ while(lo.length>=2&&cr(lo[lo.length-2],lo[lo.length-1],q)<=0) lo.pop(); lo.push(q); }
  const up=[]; for(let i=pts.length-1;i>=0;i--){ const q=pts[i]; while(up.length>=2&&cr(up[up.length-2],up[up.length-1],q)<=0) up.pop(); up.push(q); }
  lo.pop(); up.pop(); return lo.concat(up);
}
// 网格单元集合 → 可绘制环：正常取凸包；若退化成线段/单点则退化为包围盒矩形（保证有面积，点击不会缩放成空白）
function cellsToRing(cells){
  if(cells.length===0) return null;
  const pts=cells.map(idx=>[GY0+((idx/GCOLS)|0)*STEP+STEP/2, GX0+(idx%GCOLS)*STEP+STEP/2]);
  let ring=convexHull(pts);
  if(ring.length>=3) return ring;
  let minLat=Infinity,maxLat=-Infinity,minLng=Infinity,maxLng=-Infinity;
  for(const p of pts){ if(p[0]<minLat)minLat=p[0]; if(p[0]>maxLat)maxLat=p[0]; if(p[1]<minLng)minLng=p[1]; if(p[1]>maxLng)maxLng=p[1]; }
  const pad=STEP;
  return [[maxLat+pad,minLng-pad],[maxLat+pad,maxLng+pad],[minLat-pad,maxLng+pad],[minLat-pad,minLng-pad]];
}
// 用当前所有州的实时边界，栅格化算出重叠/缝隙，返回问题区数组
function computeSeams(){
  const N=states.length;
  const cov=new Int16Array(GCOLS*GROWS);
  const masks=states.map(()=>new Uint8Array(GCOLS*GROWS));
  // 1) 各州扫描线填充
  states.forEach((st,si)=>{
    const ring=st.bnd, n=ring.length; if(n<3) return;
    const m=masks[si];
    for(let r=0;r<GROWS;r++){
      const y=GY0+r*STEP; const xs=[];
      for(let i=0;i<n;i++){ const a=ring[i], b=ring[(i+1)%n]; const ya=a[0],yb=b[0],xa=a[1],xb=b[1];
        if((ya<=y&&yb>y)||(yb<=y&&ya>y)){ const t=(y-ya)/(yb-ya); xs.push(xa+t*(xb-xa)); } }
      xs.sort((p,q)=>p-q);
      for(let k=0;k+1<xs.length;k+=2){ let c0=Math.floor((xs[k]-GX0)/STEP), c1=Math.floor((xs[k+1]-GX0)/STEP);
        if(c1<0||c0>=GCOLS) continue; if(c0<0)c0=0; if(c1>=GCOLS)c1=GCOLS-1;
        for(let c=c0;c<=c1;c++){ const idx=r*GCOLS+c; cov[idx]++; m[idx]=1; } }
    }
  });
  // 2) 从边界洪水填充，标记"外部"空地（外部不算州际缝隙）
  const outside=new Uint8Array(GCOLS*GROWS); const stk=[];
  const pushO=i=>{ if(outside[i]||cov[i]>0) return; outside[i]=1; stk.push(i); };
  for(let c=0;c<GCOLS;c++){ pushO(c); pushO((GROWS-1)*GCOLS+c); }
  for(let r=0;r<GROWS;r++){ pushO(r*GCOLS); pushO(r*GCOLS+GCOLS-1); }
  while(stk.length){ const i=stk.pop(); const r=(i/GCOLS)|0,c=i%GCOLS;
    if(r>0)pushO(i-GCOLS); if(r<GROWS-1)pushO(i+GCOLS); if(c>0)pushO(i-1); if(c<GCOLS-1)pushO(i+1); }
  // 3) 侵蚀（开运算的"腐"）滤掉 1 格 / 1 格宽的虚假重叠与缝隙条纹；
  //    再从保留的"种子"在原始掩膜上洪水填充，得到真实问题区（避免误删真实宽重叠/缝隙）
  function erodeMask(isOn){
    const er=new Uint8Array(GCOLS*GROWS);
    for(let i=0;i<cov.length;i++){ if(!isOn(i)) continue; const r=(i/GCOLS)|0,c=i%GCOLS;
      if(r>0&&r<GROWS-1&&c>0&&c<GCOLS-1 && isOn(i-GCOLS)&&isOn(i+GCOLS)&&isOn(i-1)&&isOn(i+1)) er[i]=1; }
    return er;
  }
  const overlapSeed=erodeMask(i=>cov[i]>=2);
  const gapSeed=erodeMask(i=>cov[i]===0&&!outside[i]);
  function floodFromSeed(seed, isOn, type){
    const visited=new Uint8Array(GCOLS*GROWS); const out=[];
    for(let i=0;i<cov.length;i++){
      if(visited[i]||!seed[i]) continue;
      const cells=[]; const q=[i]; visited[i]=1;
      while(q.length){ const idx=q.pop(); cells.push(idx);
        const r=(idx/GCOLS)|0,c=idx%GCOLS;
        const nb=[]; if(r>0)nb.push(idx-GCOLS); if(r<GROWS-1)nb.push(idx+GCOLS); if(c>0)nb.push(idx-1); if(c<GCOLS-1)nb.push(idx+1);
        for(const j of nb){ if(!visited[j]&&isOn(j)){ visited[j]=1; q.push(j); } } }
      const ring=cellsToRing(cells); if(!ring) continue;
      let sy=0; for(const idx of cells) sy+=(GY0+((idx/GCOLS)|0)*STEP+STEP/2); const clat=sy/cells.length;
      const cellKm=STEP*DEGKM*(STEP*DEGKM*Math.cos(clat*Math.PI/180));
      const km2=cells.length*cellKm;
      const stSet=new Set();
      if(type==='overlap'){ for(let si=0;si<N;si++) if(masks[si][i]) stSet.add(states[si].name); }
      else { for(const idx of cells){ const r=(idx/GCOLS)|0,c=idx%GCOLS;
        const nb=[]; if(r>0)nb.push(idx-GCOLS); if(r<GROWS-1)nb.push(idx+GCOLS); if(c>0)nb.push(idx-1); if(c<GCOLS-1)nb.push(idx+1);
        for(const j of nb){ if(j>=0&&j<cov.length && cov[j]>0) for(let si=0;si<N;si++) if(masks[si][j]) stSet.add(states[si].name); } } }
      out.push({type, km2, states:[...stSet], ring});
    }
    return out;
  }
  const overlaps=floodFromSeed(overlapSeed, i=>cov[i]>=2, 'overlap');
  const gaps=floodFromSeed(gapSeed, i=>cov[i]===0&&!outside[i], 'gap');
  const issues=overlaps.concat(gaps).filter(it=> it.km2>=MIN_AREA_KM2).sort((a,b)=>b.km2-a.km2);
  return issues;
}
function fitIssue(ring){
  let b=L.latLngBounds(ring);
  const mz=b.getNorth()-b.getSouth(), mx=b.getEast()-b.getWest(), MIN=0.6;
  if(mz<MIN||mx<MIN){ const c=b.getCenter(); b=L.latLngBounds([c.lat-MIN/2,c.lng-MIN/2],[c.lat+MIN/2,c.lng+MIN/2]); }
  map.fitBounds(b.pad(1.3));
}
function renderIssues(){
  issueGroup.clearLayers(); issueLayers.length=0;
  const box=document.getElementById('issueList'); box.innerHTML='';
  const t0=performance.now();
  const issues=computeSeams();
  const t1=performance.now();
  let ov=0, ovk=0, gpk=0;
  issues.forEach(it=>{
    if(it.type==='overlap'){ ov++; ovk+=it.km2; } else { gpk+=it.km2; }
    const color=it.type==='overlap'?'#ff5a5a':'#ffd54a';
    const poly=L.polygon(it.ring,{color,weight:2,opacity:0.95,fillColor:color,fillOpacity:0.45,interactive:true});
    poly.bindTooltip((it.type==='overlap'?'重叠 ':'缝隙 ')+Math.round(it.km2).toLocaleString()+' km² · '+(it.states.join(' / ')||'多州'),{sticky:true});
    poly.addTo(issueGroup); issueLayers.push(poly);
    const b=document.createElement('button'); b.className='iss';
    b.innerHTML='<span class="tag" style="background:'+color+'"></span>'+Math.round(it.km2).toLocaleString()+' km² · '+(it.states.join('/')||'多州');
    b.onclick=()=>{ fitIssue(it.ring); setStatus((it.type==='overlap'?'重叠区 ':'缝隙区 ')+Math.round(it.km2).toLocaleString()+' km²，涉及 '+it.states.join('、')); };
    box.appendChild(b);
  });
  const gapN=issues.length-ov;
  setStatus('问题区实时演算完成（'+(t1-t0).toFixed(0)+'ms）｜重叠 '+ov+' 处 '+Math.round(ovk).toLocaleString()+' km²，缝隙 '+gapN+' 处 '+Math.round(gpk).toLocaleString()+' km²');
}
// 编辑后若已勾选"显示问题区"，自动防抖重算
let issueTimer=null;
function afterEdit(){
  if(document.getElementById('chkIssues').checked){
    clearTimeout(issueTimer);
    issueTimer=setTimeout(()=>{ if(document.getElementById('chkIssues').checked) renderIssues(); }, 200);
  }
}
document.getElementById('chkIssues').onchange=e=>{
  const box=document.getElementById('issueList');
  if(e.target.checked){ renderIssues(); issueGroup.addTo(map); box.style.display='block'; issueGroup.eachLayer(l=>l.bringToFront()); }
  else { map.removeLayer(issueGroup); box.style.display='none'; }
};

renderBase();
setStatus('已加载 '+states.length+' 州。点左侧州名进入编辑；勾选「显示问题区」将用当前边界实时演算重叠/缝隙（每次勾选重算）。');
</script>
</body>
